product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64, jvm, wasmJs ]

aliases:
  - nonWeb: [ android, iosArm64, iosSimulatorArm64, jvm ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $kotlin.serialization.json

dependencies@nonWeb:
  - $libs.androidx.room.runtime
  - $libs.androidx.sqlite.bundled

dependencies@android:
  - $compose.uiTooling

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.turbine

settings:
  compose:
    enabled: true
    resources:
      packageName: com.lrds.androidroadapp.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization: enabled
    freeCompilerArgs:
      - -Xexpect-actual-classes

settings@nonWeb:
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler

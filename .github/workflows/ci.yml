name: DroidQuest CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test (JVM) & Build (Android + Web Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Kotlin / Amper toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.cache/amper
          key: kotlin-amper-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', 'libs.versions.toml', '**/module.yaml') }}
          restore-keys: |
            kotlin-amper-${{ runner.os }}-

      - name: Run shared JVM unit & Room KMP tests
        run: ./kotlin test -m shared -p jvm

      - name: Build Android application
        run: ./kotlin build -m androidApp

      - name: Build Web (Kotlin/Wasm) application
        run: ./kotlin build -m webApp

name: Static Analysis & SAST

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Detekt (+ Compose Rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Detekt CLI and Compose Rules JARs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/droidquest-detekt
          key: ${{ runner.os }}-detekt-${{ hashFiles('scripts/detekt.sh') }}

      - name: Run Detekt with Compose Rules
        run: ./scripts/detekt.sh

      - name: Upload Detekt SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        if: always() && hashFiles('build/reports/detekt/detekt.sarif') != ''
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  semgrep:
    name: Semgrep SAST (Kotlin, Android, OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep CLI
        run: pip install --quiet semgrep

      - name: Run Semgrep security scan
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          mkdir -p build/reports/semgrep
          semgrep scan \
            --config p/kotlin \
            --config r/java.android \
            --config p/owasp-top-ten \
            --config config/semgrep/android-kotlin.yml \
            --metrics=off \
            --error \
            --sarif \
            --output build/reports/semgrep/semgrep.sarif \
            .

      - name: Upload Semgrep SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        if: always() && hashFiles('build/reports/semgrep/semgrep.sarif') != ''
        with:
          sarif_file: build/reports/semgrep/semgrep.sarif
          category: semgrep
